# Existing SecretBankX Echo API. Keep this as the default virtual host so
# requests that previously reached the server by IP continue to work.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# initlife public website. HTTPS is added after DNS points to this server.
server {
    listen 80;
    listen [::]:80;
    server_name initlife.com www.initlife.com;

    # /var/www/initlife is a read-only bind mount of
    # /root/workspace/initlife_website so nginx never needs access to /root.
    root /var/www/initlife/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'" always;

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1h;
        try_files $uri =404;
    }
}
